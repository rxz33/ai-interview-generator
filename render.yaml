services:
  - type: web
    name: ai-interview-backend
    env: node
    plan: starter
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
    region: oregon
    healthCheckPath: /health
